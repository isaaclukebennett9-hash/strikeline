<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strikeline - FATAL ERROR</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050000; color: #ff2a2a; font: 700 14px Consolas, 'Courier New', monospace; user-select: none; }
  body { display: flex; flex-direction: column; border: 2px solid #ff1a1a; box-shadow: inset 0 0 60px rgba(255,0,0,0.45); -webkit-app-region: drag; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #2a0000; border-bottom: 1px solid #ff1a1a; color: #ff6a6a; font-size: 12px; letter-spacing: 2px; }
  .bar .x { margin-left: auto; color: #ff4040; cursor: pointer; padding: 0 6px; -webkit-app-region: no-drag; }
  main { flex: 1; padding: 16px 22px; position: relative; }
  main::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,0,0,0.07) 0 1px, transparent 1px 3px); animation: roll 6s linear infinite; }
  @keyframes roll { to { background-position: 0 300px; } }
  .skull { float: right; white-space: pre; font-size: 10px; line-height: 10px; color: #b30000; text-shadow: 0 0 8px #f00; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { color: #ff3030; } }
  .code { color: #ff6a6a; font-size: 12px; letter-spacing: 1px; }
  h1 { margin: 6px 0 12px; font-size: 22px; letter-spacing: 3px; color: #ff1a1a; text-shadow: 2px 0 #00ffff55, -2px 0 #ff000088; animation: glitch 2.3s infinite; }
  @keyframes glitch { 0%, 92%, 100% { transform: none; } 93% { transform: translate(-4px, 1px) skewX(10deg); } 95% { transform: translate(5px, -2px); } 97% { transform: translate(-2px, 0) skewX(-8deg); } }
  .log { color: #ff8080; font-size: 12px; line-height: 1.55; min-height: 74px; }
  .prog { height: 14px; border: 1px solid #ff1a1a; margin: 8px 0 4px; }
  .prog i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(45deg, #ff1a1a 0 8px, #8a0000 8px 16px); }
  .pct { font-size: 11px; color: #ff6a6a; }
  .msg { display: none; margin-top: 12px; font: 700 17px 'Segoe UI', sans-serif; color: #fff; text-shadow: 0 0 12px #f00; }
  .row { display: none; margin-top: 14px; }
  button { -webkit-app-region: no-drag; cursor: pointer; background: #ff1a1a; color: #000; border: 0; padding: 8px 26px; font: 800 13px Consolas, monospace; letter-spacing: 3px; }
  button:hover { background: #fff; }
</style>
</head>
<body>
  <div class="bar">⚠ STRIKELINE.EXE — CRITICAL PROCESS FAILURE <span class="x" id="x">✕</span></div>
  <main>
    <div class="skull">  .-"""-.
 /       \
|  O   O  |
|    ^    |
 \  ---  /
  '-----'
  |||||||</div>
    <div class="code">STOP CODE: 0xDEAD_B077_0N · USER_PRESSED_THE_BUTTON</div>
    <h1>FATAL ERROR</h1>
    <div class="log" id="log"></div>
    <div class="prog"><i id="bar"></i></div>
    <div class="pct" id="pct">0%</div>
    <div class="msg" id="msg">Why did you press the button? Now you have to redownload the game...</div>
    <div class="row" id="row"><button id="ok">OK</button></div>
  </main>
<script>
  // Just a prank: nothing here touches any files. Your progress is saved and the game opens normally next time.
  const lines = ['> segmentation fault in strikeline_core.dll', '> memory dump: 0x7FFE0000 … 0x7FFEFFFF', '> corrupting game files…', '> wiping strikeline/assets…', '> integrity check: FAILED'];
  const log = document.getElementById('log'), bar = document.getElementById('bar'), pct = document.getElementById('pct');
  let i = 0, p = 0;
  const tick = setInterval(() => { if (i < lines.length) log.innerHTML += lines[i++] + '<br>'; }, 380);
  const fill = setInterval(() => {
    p = Math.min(100, p + Math.random() * 9);
    bar.style.width = p + '%'; pct.textContent = (p >= 100 ? 'GAME FILES DESTROYED' : 'DELETING… ' + Math.floor(p) + '%');
    if (p >= 100) { clearInterval(fill); clearInterval(tick); document.getElementById('msg').style.display = 'block'; document.getElementById('row').style.display = 'block'; }
  }, 160);
  const shut = () => { try { window.close(); } catch {} };
  document.getElementById('ok').onclick = shut;
  document.getElementById('x').onclick = shut;
</script>
</body>
</html>
