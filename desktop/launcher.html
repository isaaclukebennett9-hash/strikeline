<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strikeline</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap">
<style>
  :root { --bg: #0b0e14; --txt: #e8ecf4; --muted: #8a93a6; --acc: #ff7a1a; --bad: #ff5a5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 600 16px Rajdhani, 'Segoe UI', sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1000px 500px at 70% 20%, rgba(255,122,26,0.15), transparent 60%), radial-gradient(800px 500px at 10% 90%, rgba(61,139,255,0.1), transparent 60%), var(--bg); }
  .wrap { text-align: center; padding: 16px; max-width: 560px; }
  .logo { font: 900 64px Orbitron, sans-serif; letter-spacing: 6px; text-shadow: 0 0 40px rgba(255,122,26,0.3); }
  .logo span { color: var(--acc); }
  .msg { margin-top: 22px; color: var(--muted); min-height: 24px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--acc); border-right-color: transparent; border-radius: 50%; animation: s .7s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
  h2 { font: 700 20px Orbitron, sans-serif; letter-spacing: 2px; color: var(--bad); margin: 26px 0 6px; }
  button { cursor: pointer; border: 0; border-radius: 8px; font: 700 16px Rajdhani, sans-serif; letter-spacing: 2px; padding: 12px 26px; color: #111; background: var(--acc); margin-top: 16px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">STRIKE<span>LINE</span></div>
  <div id="boot"><div class="msg" id="msg"><span class="spin"></span>Starting…</div></div>
  <div id="err" class="hidden"><h2>COULDN'T START</h2><div class="msg" id="errMsg"></div><button id="btnRetry">TRY AGAIN</button></div>
  <div id="crash" class="hidden"><h2>THE GAME CRASHED</h2><div class="msg" id="crashMsg">Sorry about that — jump straight back in.</div><button id="btnRejoin">REJOIN</button></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const D = window.desktop;
  D.onStatus((t) => { $('msg').innerHTML = '<span class="spin"></span>' + t; });
  D.onBootError((t) => { $('boot').classList.add('hidden'); $('err').classList.remove('hidden'); $('errMsg').textContent = t; });
  $('btnRetry').onclick = () => { $('err').classList.add('hidden'); $('boot').classList.remove('hidden'); D.retry(); };
  const qs = new URLSearchParams(location.search);
  if (qs.get('crashed')) {
    $('boot').classList.add('hidden'); $('crash').classList.remove('hidden');
    $('crashMsg').textContent = `Sorry about that (${qs.get('crashed')}). Jump straight back in — if it keeps happening, set Graphics to Low in Settings.`;
    $('btnRejoin').onclick = () => D.rejoin(qs.get('rejoin'));
  }
</script>
</body>
</html>
